name: Governance local qualification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    name: Governance checks and release gate fixtures
    runs-on: ubuntu-latest
    # Host image Git filters must not affect source-bound fixture verification.
    # Repository-local filters remain visible and are rejected by the verifier.
    env:
      GIT_CONFIG_NOSYSTEM: "1"
      GIT_CONFIG_GLOBAL: /dev/null
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: bun install --frozen-lockfile
      # Docs is a Moon project installed from its own pinned lock.
      - run: bun run docs:install
      - run: bun run check
      - run: bun run build
      # This verifies actual blocked patch/minor and simulated reviewed-major cases.
      # It does not turn the intentionally unsafe dogfood candidate into a releasable package.
      - run: bun run release:demo
      - run: bun run dogfood:report
      - run: bun run storybook:build
      - run: bun run governator snapshot export --report artifacts/dogfood-governance.json --release artifacts/dogfood-release.json --config governance/release.json --out artifacts/m2-snapshot.json
      - run: bun run mcp:smoke --snapshot artifacts/m2-snapshot.json
