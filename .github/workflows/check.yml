name: Governance local qualification
on:
  pull_request:
  push:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    name: Governance checks and release gate fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - uses: actions/setup-node@v4
        with:
          node-version: "24.15.0"
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: bun run build
      - run: bun run storybook:build
      # This verifies actual blocked patch/minor and simulated reviewed-major cases.
      # It does not turn the intentionally unsafe dogfood candidate into a releasable package.
      - run: bun run release:demo
