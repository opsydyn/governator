name: Deploy documentation to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    env:
      GOVERNATOR_PAGES: "true"
      GIT_CONFIG_NOSYSTEM: "1"
    steps:
      # Match the source-verification environment used by the governance checks.
      - name: Prepare isolated Git configuration
        run: |
          install -m 600 /dev/null "$RUNNER_TEMP/governator-gitconfig"
          echo "GIT_CONFIG_GLOBAL=$RUNNER_TEMP/governator-gitconfig" >> "$GITHUB_ENV"
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.2"
      - run: bun install --frozen-lockfile
      - run: bun install --cwd apps/docs --frozen-lockfile
      - uses: actions/configure-pages@v5
      - run: bun run --cwd apps/docs build
      - run: bun run dogfood:report
      - run: bun run storybook:build
      - run: mkdir -p apps/docs/dist/storybook && cp -R apps/storybook-demo/storybook-static/. apps/docs/dist/storybook/
      - run: test -f apps/docs/dist/storybook/index.html && test -f apps/docs/dist/storybook/governance-report.json
      - run: bun scripts/check-docs-links.ts
      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/docs/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
