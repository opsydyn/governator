name: Publish retained Governator 0.2.0
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "Rehearse or publish the retained 0.2.0 archives"
        type: choice
        options: [rehearse, publish]
        required: true
        default: rehearse
      confirmation:
        description: "For publish only: type publish-governator-0.2.0"
        type: string
        required: false
        default: ""

concurrency:
  group: governator-npm-release
  cancel-in-progress: false
permissions:
  contents: read

jobs:
  fetch:
    if: ${{ github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      # GitHub requires push access to see draft releases. This job executes no repository code.
      contents: write
    outputs:
      artifact-id: ${{ steps.transfer.outputs.artifact-id }}
    steps:
      - name: Download retained draft candidate assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release download governator-v0.2.0-candidate --repo "$GITHUB_REPOSITORY" --dir candidate \
            --pattern opsydyn-governator-cli-0.2.0.tgz \
            --pattern opsydyn-governator-mcp-0.2.0.tgz \
            --pattern opsydyn-storybook-addon-governator-0.2.0.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: transfer
        with:
          name: retained-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: candidate/*.tgz
          if-no-files-found: error
          retention-days: 14
  release:
    if: ${{ github.ref == 'refs/heads/main' }}
    needs: fetch
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "24.15.0"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          artifact-ids: ${{ needs.fetch.outputs.artifact-id }}
          merge-multiple: true
          path: candidate
      - name: Verify retained archive hashes
        run: node scripts/publish-retained.ts verify candidate
      - name: Rehearse archive commands without publication
        if: ${{ inputs.mode == 'rehearse' }}
        run: node scripts/publish-retained.ts rehearse candidate
      - name: Publish retained archives and verify npm bytes
        if: ${{ inputs.mode == 'publish' }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          GOVERNATOR_PUBLISH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail
          node scripts/publish-retained.ts publish candidate > "$RUNNER_TEMP/release-receipt.json"
          cat "$RUNNER_TEMP/release-receipt.json" >> "$GITHUB_STEP_SUMMARY"
