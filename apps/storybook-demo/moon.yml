dependsOn: ["demo-ui"]
tasks:
  dev:
    command: "bun run dev"
    deps: ["^:build"]
    options:
      cache: false
      persistent: true
  build:
    command: "bun run build"
    deps: ["^:build"]
    inputs: ["src/**/*", ".storybook/**/*", "public/**/*", "package.json", "/bun.lock"]
    outputs: ["storybook-static"]
    # Generated ignored public reports do not participate in Moon's input hashing.
    # Rebuild to avoid presenting a previous source commit's governance report.
    options:
      cache: false
