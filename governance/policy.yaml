{
  "schemaVersion": 1,
  "policyVersion": "dogfood-local-unit-v1",
  "requirements":
    {
      "stable":
        { "checks": [{ "id": "unit-test", "acceptedProducers": ["vitest"], "maxAgeHours": 24 }] },
    },
  "transitions":
    {
      "draft": ["candidate"],
      "candidate": ["stable"],
      "stable": ["deprecated"],
      "deprecated": ["retired"],
      "retired": [],
    },
  "waivers": { "enabled": true, "maxDurationDays": 14, "disallowFor": ["ownership"] },
}
