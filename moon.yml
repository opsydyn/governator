tasks:
  typecheck:
    command: "bun --bun tsc --noEmit"
    inputs:
      [
        "packages/*/src/**/*",
        "apps/*/src/**/*",
        "apps/*/.storybook/**/*",
        "packages/*/package.json",
        "apps/*/package.json",
        "scripts/**/*",
        "tests/**/*",
        "tsconfig.json",
        "bun.lock",
      ]
  lint:
    command: "bun --bun oxlint --deny-warnings --config oxlint.config.ts packages apps scripts tests"
    inputs:
      [
        "packages/*/src/**/*",
        "apps/*/src/**/*",
        "apps/*/.storybook/**/*",
        "scripts/**/*",
        "tests/**/*",
        "oxlint.config.ts",
        "bun.lock",
      ]
  format:
    command: "bun --bun oxfmt --check ."
    options:
      cache: false
  test:
    command: "bun --bun vitest run"
    inputs:
      [
        "packages/*/src/**/*",
        "apps/*/src/**/*",
        "apps/*/.storybook/**/*",
        "packages/*/package.json",
        "apps/*/package.json",
        "tests/**/*",
        "governance/**/*",
        "scripts/**/*",
        "bun.lock",
        "vitest.config.ts",
      ]
  boundaries:
    command: "bun run boundaries"
    options:
      cache: false
  protocol:
    command: "bun run protocol:check"
    options:
      cache: false
  addon:
    deps: ["storybook-addon:build"]
    command: "bun run addon:check"
    options:
      cache: false
  check:
    deps: ["typecheck", "lint", "format", "test", "boundaries", "protocol", "addon"]
    command: "bun --version"
    options:
      cache: false
