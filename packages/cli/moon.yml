dependsOn: [core, versioning, query]
tasks:
  build:
    command: "bun run build"
    deps: ["^:build"]
    inputs:
      [
        "src/**/*",
        "package.json",
        "tsdown.config.ts",
        "/bun.lock",
        "/scripts/safe-build-output.ts",
        "/scripts/package-cli-skill.ts",
        "/skills/governator-onboarding/**/*",
      ]
    outputs: ["dist"]
